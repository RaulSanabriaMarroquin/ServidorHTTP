[package]
name = "proyecto-http"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
lazy_static = "1.4"
flate2 = "1.0"
xz2 = "0.1"
sha2 = "0.10"
hex = "0.4"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1